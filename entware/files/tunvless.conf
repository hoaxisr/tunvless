# tunvless settings, read by /opt/etc/init.d/S99tunvless.
# After a change: /opt/etc/init.d/S99tunvless restart

# Start the tunnel at boot and on `start`.
ENABLED=no

# The nodes, separated by spaces: vless:// links (in single quotes) and files — vless:// links
# (plain or base64), or Xray, sing-box or Clash configs with VLESS outbounds. They are numbered from 0
# in this order, as `tunvless --list` shows.
NODES=/opt/etc/tunvless/nodes.txt
# Candidates, comma-separated, in order of preference, e.g. "3,0,5". Empty: every node. A single
# number is used without a check at startup.
NODE=

# Failover: how many nodes are active at once (new connections are spread over them), how they are
# spread (connection, site or site-client) and how often each is checked, in seconds. A dead active
# node is replaced by the next candidate that answers, without a restart.
ACTIVE=1
BY=connection
INTERVAL=60

# The TUN device and its address.
DEVICE=tunvless0
ADDRESS=198.51.100.1/32

# Routes into the tunnel, separated by spaces: "default" (0.0.0.0/1 and 128.0.0.0/1) or prefixes,
# e.g. "1.1.1.0/24 8.8.8.8/32". Empty: the device comes up without routes (route into it yourself).
ROUTES=
# Routing table for ROUTES (number). Empty: main.
TABLE=

# How the tunnel's own connection to the server stays out of the tunnel. With neither, a route
# above that covers the server gets a host route to the server through its current gateway.
MARK=
BIND_DEV=

# Anything else, e.g. "--insecure" or "--ca /opt/etc/ssl/my-ca.pem" or "--silence 30".
OPTS=

# Debugging variables (README, "Debugging variables") are passed by exporting them here, e.g.
# export STEER_TUN_STATS=1
